<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d24" />
    <meta name="description" content="Phishing Multimodal : plateforme de détection du phishing, gestion des comptes et journal d'audit." />
    <title>Phishing Multimodal</title>
    <script>
      // Applique le thème avant le premier rendu pour éviter tout flash.
      try {
        var t = localStorage.getItem("pm.theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

# Reverse proxy in front of gunicorn - docker-compose.yml service `nginx`.
# Served as /etc/nginx/conf.d/default.conf (replaces the default server).
#
# The backend is NOT declared as an `upstream { server web:8000; }` block on
# purpose: nginx would resolve that address once, at configuration load, and
# keep it forever. `docker compose up -d` then gives `web` a new IP and every
# request would answer 502 until nginx is restarted. With the resolver below,
# `proxy_pass $backend` is re-resolved every 10 seconds (Docker's embedded
# DNS), so recreating the backend needs no nginx restart.

server {
    listen 80;
    server_name _;

    # Do not advertise the nginx version in error pages / Server header.
    server_tokens off;

    # Uploads are not part of the API today: a body above 1 MB is refused
    # before it is proxied (ISO-6.6, denial-of-service surface).
    client_max_body_size 1m;

    # Security headers. The same values are sent by Django's
    # SecurityMiddleware on proxied responses (identical value on purpose,
    # so a double header can never contradict itself); nginx is the only one
    # that adds them to /static/* responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss image/svg+xml;

    # Collected static files (collectstatic -> static_volume, mounted read-only).
    # No add_header here on purpose: a location that declares one does NOT
    # inherit the server-level security headers above.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public";
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # OVERWRITE, never $proxy_add_x_forwarded_for.
        # The header nginx forwards contains exactly ONE address: the peer it
        # accepted the connection from ($remote_addr). Nothing the client put
        # in its own X-Forwarded-For survives the hop.
        # Django runs behind this single proxy with NUM_PROXIES=1:
        # rest_framework.throttling.BaseThrottle.get_ident() reads the LAST
        # element of X-Forwarded-For when NUM_PROXIES >= 1, i.e. the value
        # nginx wrote. That is the throttle key for the login/register
        # limits and for the BR-02 quick-check counter, so a client cannot
        # pick its own identity by sending the header.
        proxy_set_header X-Forwarded-For $remote_addr;

        # Tells Django which scheme the CLIENT used (USE_X_FORWARDED_PROTO ->
        # SECURE_PROXY_SSL_HEADER). $scheme is nginx's own connection scheme.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

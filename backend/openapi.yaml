      - analyzing
      - detected
      - under_review
      - confirmed
      - false_positive
      - blocked
      - failed
      type: string
      description: |-
        * `submitted` - Submitted
        * `analyzing` - Analyzing
        * `detected` - Detected
        * `under_review` - Under Review
        * `confirmed` - Confirmed
        * `false_positive` - False Positive
        * `blocked` - Blocked
        * `failed` - Failed

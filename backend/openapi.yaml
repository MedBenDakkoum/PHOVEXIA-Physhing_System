    ReviewDetail:
      type: object
      description: |-
        GET /api/review/{uuid}/ : the scan + its report, notes and decision.

        Analyst-only: the reporter email, the note authors and the reviewing
        analyst are visible here, and ONLY here (the owner-facing scan detail
        never contains them).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        domain:
          type: string
          readOnly: true
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ScanStatusEnum'

openapi: 3.0.3
info:
  title: Phishing Multimodal API
  version: 0.1.0
paths:
  /api/audit/logs/:
    get:
      operationId: audit_logs_list
      description: 'Journal d''audit : lecture seule, paginé, filtrable, réservé à
        l''administrateur.'
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - blocklist.added
          - blocklist.exported
          - blocklist.removed
          - blocklist_add
          - blocklist_remove
          - decision
          - login_failed
          - login_success
          - model_update
          - note.added
          - quick_check.created
          - register
          - report.created
          - role_change
          - scan.decided
          - scan.rescanned
          - scan_created
          - scan_status_changed
          - user_reactivate
          - user_suspend
        description: |-
          * `register` - Inscription
          * `login_success` - Connexion réussie
          * `login_failed` - Connexion échouée
          * `role_change` - Changement de rôle
          * `user_suspend` - Suspension d'un compte
          * `user_reactivate` - Réactivation d'un compte
          * `decision` - Décision
          * `blocklist_add` - Ajout à la blocklist
          * `blocklist_remove` - Retrait de la blocklist
          * `model_update` - Modèle
          * `scan_created` - Création d'un scan
          * `scan_status_changed` - Changement de statut d'un scan
          * `quick_check.created` - Quick check anonyme
          * `report.created` - Signalement d'un verdict
          * `scan.decided` - Décision d'un analyste
          * `note.added` - Note interne d'un analyste
          * `scan.rescanned` - Nouveau scan relancé par un analyste
          * `blocklist.added` - Ajout à la blocklist
          * `blocklist.removed` - Retrait de la blocklist
          * `blocklist.exported` - Export de la blocklist
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: user
        schema:
          type: number
      - in: query
        name: user_email
        schema:
          type: string
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/audit/logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      description: 'Journal d''audit : lecture seule, paginé, filtrable, réservé à
        l''administrateur.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audit log.
        required: true
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Connexion JWT + journalisation des succès et des échecs.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.

        Step 8d: throttled, THROTTLE_REFRESH per IP (default 60/min), rate read
        from settings.REST_FRAMEWORK["DEFAULT_THROTTLE_RATES"].
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/users/:
    get:
      operationId: auth_users_list
      description: Gestion des utilisateurs (admin uniquement). DELETE = suspension
        du compte.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - analyst
          - end_user
        description: |-
          * `admin` - Administrateur
          * `analyst` - Analyste
          * `end_user` - Utilisateur
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/auth/users/{id}/:
    get:
      operationId: auth_users_retrieve
      description: Gestion des utilisateurs (admin uniquement). DELETE = suspension
        du compte.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    put:
      operationId: auth_users_update
      description: Gestion des utilisateurs (admin uniquement). DELETE = suspension
        du compte.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: auth_users_partial_update
      description: Gestion des utilisateurs (admin uniquement). DELETE = suspension
        du compte.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    delete:
      operationId: auth_users_destroy
      description: Gestion des utilisateurs (admin uniquement). DELETE = suspension
        du compte.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/blocklist/:
    get:
      operationId: blocklist_list
      description: 'Uniquement les entrées actives. Filtres : `q` (sous-chaîne du
        domaine ou de la note), `reason`, `added_by` (email), `created_after`, `created_before`
        (une date seule = le jour entier local). `ordering` : created_at, domain,
        reason (« - » pour le décroissant).'
      summary: Lister la blocklist (US38)
      parameters:
      - in: query
        name: added_by
        schema:
          type: string
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: reason
        schema:
          type: string
          enum:
          - campaign
          - confirmed_phishing
          - manual
        description: |-
          * `confirmed_phishing` - Confirmed phishing
          * `campaign` - Campaign
          * `manual` - Manual
      tags:
      - blocklist
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBlocklistEntryList'
          description: ''
    post:
      operationId: blocklist_create
      description: 'Le domaine est normalisé (minuscules, IDNA/punycode, sans point
        final ; une adresse IP est refusée). BR-03 : une seule entrée active par domaine,
        sinon 409 `already_blocked`. Audit : `blocklist.added`.'
      summary: Ajouter un domaine à la blocklist (US38)
      tags:
      - blocklist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlocklistCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BlocklistCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlocklistCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocklistEntry'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'Conflit (409) : `code` = `already_blocked` (BR-03).'
  /api/blocklist/{public_id}/:
    delete:
      operationId: blocklist_destroy
      description: 'Soft delete : la ligne est conservée (historique + audit) mais
        `is_active` passe à false. BR-12 : le corps `{"reason": ...}` est OBLIGATOIRE
        et non vide, sinon 400. Audit : `blocklist.removed`.'
      summary: Retirer un domaine de la blocklist (US39)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - blocklist
      security:
      - jwtAuth: []
      responses:
        '204':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Entrée désactivée (soft delete) + audit blocklist.removed.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocklistError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Entrée inconnue ou déjà retirée (404).
  /api/blocklist/export/:
    get:
      operationId: blocklist_export_retrieve
      description: GET /api/blocklist/export/ - CSV stream of active entries (US40).
      summary: Exporter la blocklist en CSV (US40)
      tags:
      - blocklist
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: 'Fichier CSV (domain, reason, note, added_by, created_at) des
            entrées actives. Protection anti injection CSV : une cellule commençant
            par = + - @ reçoit un apostrophe en tête. Audit : `blocklist.exported`.'
  /api/brands/:
    get:
      operationId: brands_list
      description: Réservé aux administrateurs.
      summary: Lister les marques protégées (US55)
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - brands
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProtectedBrandList'
          description: ''
    post:
      operationId: brands_create
      description: 'Admin uniquement. Le domaine est normalisé (minuscules, IDNA/punycode)
        et unique. Audit : pas d''action dédiée, l''entrée est visible dans le journal
        via la cible.'
      summary: Créer une marque protégée (US55)
      tags:
      - brands
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtectedBrandCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProtectedBrandCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProtectedBrandCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedBrand'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
          description: ''
  /api/brands/{public_id}/:
    get:
      operationId: brands_retrieve
      description: PATCH/DELETE /api/brands/{uuid}/ - ADMIN ONLY (US55).
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - brands
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedBrand'
          description: ''
    put:
      operationId: brands_update
      description: PATCH/DELETE /api/brands/{uuid}/ - ADMIN ONLY (US55).
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - brands
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtectedBrand'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProtectedBrand'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProtectedBrand'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedBrand'
          description: ''
    patch:
      operationId: brands_partial_update
      description: 'Admin uniquement. Champs optionnels : name, domain, is_active.'
      summary: Modifier une marque protégée (US55)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - brands
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProtectedBrandPatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProtectedBrandPatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProtectedBrandPatch'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedBrand'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
          description: ''
    delete:
      operationId: brands_destroy
      description: PATCH/DELETE /api/brands/{uuid}/ - ADMIN ONLY (US55).
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - brands
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/notifications/:
    get:
      operationId: notifications_list
      description: Uniquement les miennes, non lues d'abord, paginées. La réponse
        contient aussi `unread_count`.
      summary: Mes notifications (US57)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/notifications/{public_id}/read/:
    post:
      operationId: notifications_read_create
      description: 'Positivement idempotent : déjà lue → 200 inchangé. La notification
        d''un autre compte (ou un UUID inconnu) répond 404, jamais 403.'
      summary: Marquer une notification comme lue (US57)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Notification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Notification'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/quick-check/:
    post:
      operationId: quick_check_create
      description: 'Valide l''URL (BR-07, protection SSRF), crée un scan anonyme en
        mode fast et le file d''attente Celery. Limite : `QUICK_CHECK_HOURLY_LIMIT`
        par heure et par adresse IP (BR-02), sinon 429 avec `Retry-After`. Le corps
        ne peut contenir que `url` : tout autre champ est ignoré. Une URL refusée
        ne crée aucun scan mais consomme une unité du budget horaire.'
      summary: Vérifier un lien sans compte (US11)
      tags:
      - quick-check
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickCheck'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuickCheck'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuickCheck'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickCheckCreated'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickCheckRate'
          description: ''
  /api/quick-check/{public_id}/:
    get:
      operationId: quick_check_retrieve
      description: Uniquement `status`, `verdict`, `score` et `finished_at`, et uniquement
        pour les scans anonymes en mode fast.
      summary: Suivre un quick check anonyme (US11)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - quick-check
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickCheckResult'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'Scan introuvable : UUID inconnu, ou scan possédé par un compte
            (404 volontaire, jamais 403).'
  /api/review/{public_id}/:
    get:
      operationId: review_retrieve
      description: Le scan, son signalement (label revendiqué, commentaire, statut),
        les notes internes des analysts et l'information de décision (analyste, date,
        commentaire). Visible analyste et admin uniquement.
      summary: Détail d'un cas de revue (US33)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - review
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetail'
          description: ''
  /api/review/{public_id}/decision/:
    post:
      operationId: review_decision_create
      description: '`decision` = `confirm_phishing` (→ `confirmed`) ou `false_positive`
        (→ `false_positive`), uniquement depuis `under_review` (BR-04, sinon 409).
        Enregistre l''analyste, la date et le commentaire, résout le signalement et
        notifie son auteur (US57). Audit : `scan.decided`. `add_to_blocklist` (optionnel,
        uniquement avec confirm_phishing) ajoute le domaine à la blocklist dans la
        même transaction et fait passer le scan de `confirmed` à `blocked` (US38/US41).'
      summary: Décider d'un cas (US34)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Decision'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Decision'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Scan introuvable (404).
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'Conflit (409) : `code` = `already_reported` (BR-05), `not_reportable`
            (statut du scan) ou `not_decidable` (BR-04).'
  /api/review/{public_id}/notes/:
    post:
      operationId: review_notes_create
      description: 'Note visible des analysts et admins uniquement, jamais du propriétaire
        du scan. Audit : `note.added` (longueur seulement, jamais le texte).'
      summary: Ajouter une note interne (US35)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NoteCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NoteCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
  /api/review/{public_id}/rescan/:
    post:
      operationId: review_rescan_create
      description: 'Crée un NOUVEAU scan (même URL, mode full, propriétaire = l''analyste,
        `rescan_of` = l''original), revalidé (BR-07) et compté dans le quota quotidien
        de l''analyste (BR-01). Audit : `scan.rescanned`.'
      summary: Relancer un scan (US36)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescanCreated'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RescanCreated'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RescanCreated'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RescanCreated'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Quota quotidien de l'analyste atteint (BR-01) + Retry-After.
  /api/review/queue/:
    get:
      operationId: review_queue_list
      description: 'Scans en `under_review`, du plus ancien au plus récent par défaut.
        Filtres : `source` (uncertain = verdict incertain, reported = signalé par
        un utilisateur), `verdict`, `created_after`, `created_before` (une date seule
        `YYYY-MM-DD` couvre le jour entier local). `ordering` : `created_at` (défaut,
        du plus ancien au plus récent) ou `uncertainty` (croissant = le score le plus
        proche d''un seuil de décision d''abord). Chaque ligne porte `reported` et
        `claimed_label`. Pagination identique à l''historique.'
      summary: File de revue des analysts (US33)
      parameters:
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: source
        schema:
          type: string
          enum:
          - reported
          - uncertain
        description: |-
          * `uncertain` - Uncertain
          * `reported` - Reported
      - in: query
        name: verdict
        schema:
          type: string
          nullable: true
          enum:
          - legitimate
          - phishing
          - uncertain
        description: |-
          * `phishing` - Phishing
          * `legitimate` - Legitimate
          * `uncertain` - Uncertain
      tags:
      - review
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReviewQueueItemList'
          description: ''
  /api/scans/:
    get:
      operationId: scans_list
      description: 'Uniquement mes scans, du plus récent au plus ancien, paginé. Filtres
        (US29) : `q` (sous-chaîne de l''URL ou du domaine, littérale), `verdict`,
        `status`, `created_after` et `created_before` (ISO 8601, bornes inclusives),
        combinés par ET. Une date seule `YYYY-MM-DD` couvre le jour entier dans le
        fuseau de `TIME_ZONE` (les deux jours bornes sont donc inclusifs). Tri : `ordering`
        limité à created_at, finished_at, status, verdict, score (un « - » pour le
        décroissant) ; toute autre valeur retombe sur le tri par défaut. Une valeur
        de filtre invalide renvoie 400 avant toute requête SQL.'
      summary: Lister mes scans (US16 / US29)
      parameters:
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - -finished_at
          - -score
          - -status
          - -verdict
          - created_at
          - finished_at
          - score
          - status
          - verdict
        description: 'Tri de l''historique : l''un des champs autorisés (created_at,
          finished_at, status, verdict, score), précédé d''un « - » pour l''ordre
          décroissant. Une valeur hors liste retombe sur le tri par défaut (-created_at,
          -id).'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - analyzing
          - blocked
          - confirmed
          - detected
          - failed
          - false_positive
          - submitted
          - under_review
        description: |-
          * `submitted` - Submitted
          * `analyzing` - Analyzing
          * `detected` - Detected
          * `under_review` - Under Review
          * `confirmed` - Confirmed
          * `false_positive` - False Positive
          * `blocked` - Blocked
          * `failed` - Failed
      - in: query
        name: verdict
        schema:
          type: string
          nullable: true
          enum:
          - legitimate
          - phishing
          - uncertain
        description: |-
          * `phishing` - Phishing
          * `legitimate` - Legitimate
          * `uncertain` - Uncertain
      tags:
      - scans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedScanList'
          description: ''
    post:
      operationId: scans_create
      description: 'Valide l''URL (BR-07), applique le quota quotidien (BR-01), crée
        le scan en mode full et le file d''attente Celery (US15). Le corps ne peut
        contenir que `url` : mode, statut, verdict, score et propriétaire sont décidés
        par le serveur.'
      summary: Soumettre une URL (US12)
      tags:
      - scans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScanCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScanCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanCreated'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaExceeded'
          description: ''
  /api/scans/{public_id}/:
    get:
      operationId: scans_retrieve
      description: Identifié par l'UUID public (`id` de la réponse), jamais par la
        clé entière interne.
      summary: Détail d'un scan (US16)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - scans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Scan introuvable ou non visible par ce compte (404 volontaire,
            jamais 403).
  /api/scans/{public_id}/report/:
    post:
      operationId: scans_report_create
      description: 'Réservé au propriétaire du scan, qui doit être en `detected` ou
        `under_review` et sans signalement (BR-05 : un seul par scan, sinon 409).
        Un scan `detected` passe en `under_review` via le graphe BR-04. Le commentaire
        et le label revendiqués sont enregistrés ; une entrée `report.created` est
        écrite dans le journal d''audit.'
      summary: Signaler un verdict faux (US31)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - scans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Scan introuvable ou non possédé par ce compte (404).
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'Conflit (409) : `code` = `already_reported` (BR-05), `not_reportable`
            (statut du scan) ou `not_decidable` (BR-04).'
  /api/scans/quota/:
    get:
      operationId: scans_quota_retrieve
      description: 'Limites du jour : combien de scans restent disponibles.'
      summary: Mon quota de scans (US14)
      tags:
      - scans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quota'
          description: ''
  /api/schema/:

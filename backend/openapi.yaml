      - is_active
      - name
    ProtectedBrandCreate:
      type: object
      description: 'POST /api/brands/ body: name + domain (+ optional is_active).'
      properties:
        name:
          type: string
          maxLength: 100
        domain:
          type: string
          maxLength: 254
        is_active:
          type: boolean
          default: true
      required:
      - domain
      - name
    QuickCheck:
      type: object
      description: 'Step 9 - POST /api/quick-check/ body: {"url": "..."} and nothing
        else.'
      properties:
        url:
          type: string
      required:
      - url
    QuickCheckCreated:
      type: object
      description: 'Step 9 - 202 body: the anonymous scan reference, no other field.'
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          maxLength: 20
      required:
      - id
      - status
    QuickCheckRate:
      type: object
      description: Step 9 - 429 body (BR-02) + the Retry-After header.
      properties:
        detail:
          type: string
        limit:
          type: integer
      required:
      - detail
      - limit
    QuickCheckResult:
      type: object
      description: |-
        Step 9 - 200 body of GET /api/quick-check/{uuid}/: ONLY these fields.

        The URL, the domain, the mode and the owner are deliberately absent: an
        anonymous caller gets the verdict of an anonymous scan, nothing more.
        `detection_source` (Step 11 / US41) tells whether the verdict came from
        the model or from an immediate blocklist hit.
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/ScanStatusEnum'
          readOnly: true
        verdict:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/VerdictEnum'
          - $ref: '#/components/schemas/NullEnum'
        score:
          type: number
          format: double
          readOnly: true
          nullable: true
        detection_source:
          allOf:
          - $ref: '#/components/schemas/DetectionSourceEnum'
          readOnly: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - detection_source
      - finished_at
      - score
      - status
      - verdict
    Quota:
      type: object
      description: 'Quota snapshot (US14): remaining scans for today.'
      properties:
        limit:
          type: integer
        used:
          type: integer
        remaining:
          type: integer
        reset_at:
          type: string
          format: date-time
      required:
      - limit
      - remaining
      - reset_at
      - used
    QuotaExceeded:
      type: object
      description: 429 body of POST /api/scans/ (BR-01) + the Retry-After header.
      properties:
        detail:
          type: string
        limit:
          type: integer
        used:
          type: integer
        reset_at:
          type: string
          format: date-time
      required:

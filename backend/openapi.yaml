    Scan:
      type: object
      description: |-
        Read-only projection of a scan (list and detail).

        Step 8a: `id` is the public UUID (`public_id`), never the sequential
        integer primary key, which stays internal (ISO-6.6 anti-enumeration).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        domain:
          type: string
          readOnly: true
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ScanStatusEnum'
          readOnly: true
        verdict:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/VerdictEnum'
          - $ref: '#/components/schemas/NullEnum'
        score:
          type: number
          format: double
          readOnly: true
          nullable: true
        detection_source:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        has_report:
          type: boolean
          readOnly: true
          default: false
        report_status:
          type: string
          readOnly: true
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true

      type: object
      description: 'POST /api/scans/ body: {"url": "..."} and nothing else.'
      properties:
        url:
          type: string
      required:
      - url
    ScanCreated:
      type: object
      description: |-
        202 body of POST /api/scans/: the created scan + the quota after it.

        Step 8a: `id` is the public UUID, matching the detail URL /api/scans/<uuid>/.
        Step 11: `detection_source` distinguishes a model verdict from an immediate
        blocklist hit (US41).
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          maxLength: 2048
        status:
          type: string
          maxLength: 20
        detection_source:
          type: string
          maxLength: 10
        created_at:
          type: string
          format: date-time
        quota:
          $ref: '#/components/schemas/Quota'
      required:
      - created_at
      - detection_source
      - id
      - quota
      - status
      - url
    ScanError:
      type: object
      description: |-
        400 body: machine-readable `code` (RejectionCode) + human `detail`.

        Schema-only: the view builds this dictionary by hand, the serializer is
        never instantiated (the optional `errors` payload is a free-form dict).
      properties:
        code:
          type: string
        detail:
          type: string
        errors:
          type: object
          additionalProperties: {}
      required:
      - code
      - detail
    ScanStatusEnum:
      enum:

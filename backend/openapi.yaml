          description: ''
components:
  schemas:
    ActionEnum:
      enum:
      - register
      - login_success
      - login_failed
      - role_change
      - user_suspend
      - user_reactivate
      - decision
      - blocklist_add
      - blocklist_remove
      - model_update
      - scan_created
      - scan_status_changed
      - quick_check.created
      - report.created
      - scan.decided
      - note.added
      - scan.rescanned
      - blocklist.added
      - blocklist.removed
      - blocklist.exported
      type: string
      description: |-
        * `register` - Inscription
        * `login_success` - Connexion réussie
        * `login_failed` - Connexion échouée
        * `role_change` - Changement de rôle
        * `user_suspend` - Suspension d'un compte
        * `user_reactivate` - Réactivation d'un compte
        * `decision` - Décision
        * `blocklist_add` - Ajout à la blocklist
        * `blocklist_remove` - Retrait de la blocklist
        * `model_update` - Modèle
        * `scan_created` - Création d'un scan
        * `scan_status_changed` - Changement de statut d'un scan
        * `quick_check.created` - Quick check anonyme
        * `report.created` - Signalement d'un verdict
        * `scan.decided` - Décision d'un analyste
        * `note.added` - Note interne d'un analyste
        * `scan.rescanned` - Nouveau scan relancé par un analyste
        * `blocklist.added` - Ajout à la blocklist
        * `blocklist.removed` - Retrait de la blocklist
        * `blocklist.exported` - Export de la blocklist
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - email
      - id
      - last_login
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
        user_email:
          type: string
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        action_label:
          type: string
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        target_repr:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        metadata:
          readOnly: true
      required:
      - action
      - action_label
      - created_at
      - id
      - ip_address
      - metadata
      - target_id
      - target_repr
      - target_type
      - user
      - user_email
    BlocklistCreate:
      type: object
      description: 'POST /api/blocklist/ body: domain + reason (+ optional note /
        source_scan).'
      properties:
        domain:
          type: string
          maxLength: 254
        reason:
          $ref: '#/components/schemas/ReasonEnum'
        note:
          type: string
          maxLength: 1000
        source_scan:
          type: string
          format: uuid
          nullable: true
      required:
      - domain
      - reason
    BlocklistEntry:
      type: object
      description: Read-only projection of one blocklist entry (id = public UUID).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        domain:
          type: string
          readOnly: true
        reason:
          allOf:
          - $ref: '#/components/schemas/ReasonEnum'
          readOnly: true
        note:
          type: string
          readOnly: true
        added_by_email:
          type: string
          format: email
          readOnly: true
        source_scan:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
        removed_by_email:
          type: string
          format: email
          readOnly: true
        removed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        removal_reason:
          type: string
          readOnly: true
      required:
      - added_by_email
      - created_at
      - domain
      - id
      - is_active
      - note
      - reason
      - removal_reason
      - removed_at
      - removed_by_email
      - source_scan
    BlocklistError:
      type: object
      description: '400/409 body: machine-readable `code` + human `detail` (schema
        only).'
      properties:
        code:
          type: string
        detail:
          type: string
      required:
      - code
      - detail
    ClaimedLabelEnum:
      enum:
      - safe
      - phishing
      type: string
      description: |-
        * `safe` - Légitime
        * `phishing` - Phishing
    Decision:
      type: object
      description: POST /api/review/{uuid}/decision/ body (US34 / US38-US41).
      properties:
        decision:
          $ref: '#/components/schemas/DecisionEnum'
        comment:
          type: string
          maxLength: 1000
        add_to_blocklist:
          type: boolean
          default: false
      required:
      - decision
    DecisionEnum:
      enum:
      - confirm_phishing
      - false_positive
      type: string
      description: |-
        * `confirm_phishing` - Confirmer le phishing
        * `false_positive` - Faux positif
    DetectionSourceEnum:
      enum:
      - model
      - blocklist
      type: string
      description: |-
        * `model` - Model
        * `blocklist` - Blocklist
    KindEnum:
      enum:
      - report_decision
      type: string
      description: '* `report_decision` - Décision sur un signalement'
    ModeEnum:
      enum:
      - fast
      - full
      type: string
      description: |-
        * `fast` - Fast
        * `full` - Full
    Note:
      type: object
      description: Read-only projection of an internal note (analyst-only endpoints).
      properties:
        author_email:
          type: string
          format: email
          readOnly: true
        text:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author_email
      - created_at
      - text
    NoteCreate:
      type: object
      description: POST /api/review/{uuid}/notes/ body (US35).
      properties:
        text:
          type: string
          maxLength: 2000
      required:
      - text
    Notification:
      type: object
      description: GET /api/notifications/ item (US57). Id is the public UUID.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        scan:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        message:
          type: string
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - kind
      - message
      - read_at
      - scan
    NullEnum:
      enum:
      - null
    PaginatedAuditLogList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
    PaginatedBlocklistEntryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
